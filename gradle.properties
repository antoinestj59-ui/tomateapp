# JVM settings tuned for the 2 vCPU cloud builder.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 provides built-in Kotlin support. Applying org.jetbrains.kotlin.android on top
# of AGP 9.5.1 crashes inside KGP's AgpWithBuiltInKotlinAppliedCheck, so TOMATE uses the
# built-in Kotlin pipeline and applies only the Compose / Serialization / KSP plugins.

kotlin.code.style=official
